version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # 关键：移除 deploy，改用 environment + runtime
    environment:
      # - NVIDIA_VISIBLE_DEVICES=2  # 指定第2、第3张卡（索引从0开始）
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=3
      - OLLAMA_MAX_LOADED_MODELS=3
    runtime: nvidia  # 启用NVIDIA容器运行时
    restart: unless-stopped

volumes:
  ollama_data:
