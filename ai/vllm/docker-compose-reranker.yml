version: '3.8'

services:
  reranker:
    image: vllm/vllm-openai:latest
    container_name: qwen3-reranker-4b
    ports:
      - "30003:8000"
    volumes:
      - /mnt/hdd3/llm/Qwen:/Qwen:ro
      - ./template:/template:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=2
    runtime: nvidia
    restart: unless-stopped
    shm_size: 16g
    command: >
      /Qwen/Qwen3-Reranker-4B
      --served-model-name Qwen3-Reranker-4B
      --runner pooling
      --chat-template /template/qwen3_reranker.jinja
      --host 0.0.0.0
      --port 8000
      --max-model-len 8192
      --convert embed
      --safetensors-load-strategy prefetch


# 17GB