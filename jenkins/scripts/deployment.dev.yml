apiVersion: v1
kind: Namespace
metadata:
  name: fengqi-dev
  labels:
    environment: dev
  annotations:
    description: "Development namespace for fengqi-dev project"
spec:
  finalizers:
  - kubernetes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    k8s.kuboard.cn/workload: ai-service
  labels:
    k8s.kuboard.cn/layer: svc
    k8s.kuboard.cn/name: ai-service
  name: ai-service
  namespace: fengqi-dev
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      k8s.kuboard.cn/layer: svc
      k8s.kuboard.cn/name: ai-service
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        k8s.kuboard.cn/layer: svc
        k8s.kuboard.cn/name: ai-service
    spec:
      containers:
        - env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
          image: '192.168.1.27:8090/dev/ai-service:latest'
          imagePullPolicy: Always
          name: ai-service
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /data/conf
              name: conf
            - mountPath: /mnt/nfs
              name: nfs
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: harbor
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: conf
          nfs:
            path: /dev/configs/ai-service
            server: 192.168.1.27
        - name: nfs
          nfs:
            path: /data
            server: 192.168.1.27
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    k8s.kuboard.cn/workload: ai-service
  labels:
    k8s.kuboard.cn/layer: svc
    k8s.kuboard.cn/name: ai-service
  name: ai-service
  namespace: fengqi-dev
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      nodePort: 0
      port: 8000
      protocol: TCP
      targetPort: 8000
    - name: grpc
      nodePort: 0
      port: 9000
      protocol: TCP
      targetPort: 9000
    - name: task
      nodePort: 0
      port: 10000
      protocol: TCP
      targetPort: 10000
  selector:
    k8s.kuboard.cn/layer: svc
    k8s.kuboard.cn/name: ai-service
  sessionAffinity: None
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: ingress-dev
  annotations:
    k8s.io/ingress.class: nginx
spec:
  controller: k8s.io/ingress-nginx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: fengqi-dev
  name: service-reader
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-services
  namespace: fengqi-dev
subjects:
  - kind: ServiceAccount
    name: default
    namespace: fengqi-dev
roleRef:
  kind: Role
  name: service-reader
  apiGroup: rbac.authorization.k8s.io