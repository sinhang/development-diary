services:
  prometheus:
    restart: unless-stopped
    container_name: prometheus
    image: prom/prometheus
    ports:
      - "8091:9090"
    entrypoint:
      - /bin/prometheus
    command: 
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./data:/prometheus
      - ./conf:/etc/prometheus
