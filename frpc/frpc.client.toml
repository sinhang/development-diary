serverAddr = "0.0.0.0"
serverPort = 7000
auth.token = "token strings"

[[proxies]]
name = "projectweb"
type = "http"
localPort = 30050
localIP = "192.168.1.28"
customDomains = ["projectweb.example.com"]

[[proxies]]
name = "projectwebHttps"
type = "https"
customDomains = ["projectweb.example.com"]
localIP = "192.168.1.28"
localPort = 30050


[proxies.plugin]
type = "https2http"
localAddr = "192.168.1.28:30050"

# HTTPS 证书相关的配置
crtPath = "/home/mercury/soft/frp/ssl/projectweb.example.com.pem"
keyPath = "/home/mercury/soft/frp/ssl/projectweb.example.com.key"
hostHeaderRewrite = "192.168.1.28"
requestHeaders.set.x-from-where = "frp"


