[[proxies]]
name = "registry"
type = "http"
localPort = 5000
localIP = "127.0.0.1"    # Harbor 在本机就用 127.0.0.1
customDomains = ["registry.example.com"]

[[proxies]]
name = "harborHttps"
type = "https"
customDomains = ["registry.example.com"]

[proxies.plugin]
type = "https2http"
localAddr = "127.0.0.1:5000"    # 转发到 Harbor 的 HTTP 5000

# HTTPS 证书配置
crtPath = "/home/mercury/soft/frp/ssl/registry.example.com.pem"
keyPath = "/home/mercury/soft/frp/ssl/registry.example.com.key"
hostHeaderRewrite = "registry.example.com"
requestHeaders.set.x-from-where = "frp"