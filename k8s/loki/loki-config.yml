apiVersion: v1
kind: Namespace
metadata:
  name: loki
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: loki
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      grpc_server_max_recv_msg_size: 10485760
      grpc_server_max_send_msg_size: 10485760

    ingester:
      flush_period: 15m
      max_chunk_idle: 10m
      max_chunk_age: 1h

    common:
      ring:
        kvstore:
          store: memberlist
      replication_factor: 1
      path_prefix: /tmp/loki
      
    memberlist:
      join_members:
        - loki.loki.svc.cluster.local:7946

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      filesystem:
        directory: /tmp/loki/chunks

    limits_config:
      ingestion_rate_mb: 100
      ingestion_burst_size_mb: 200
      max_entries_limit_per_query: 10000
      per_stream_rate_limit: 10MB  # 增加每流速率限制
      per_stream_rate_limit_burst: 20MB  # 增加突发速率限制

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: loki
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.5.8
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - containerPort: 3100
              name: http
            - containerPort: 9095
              name: grpc
            - containerPort: 7946
              name: gossip
          volumeMounts:
            - name: config
              mountPath: /etc/loki
      volumes:
        - name: config
          configMap:
            name: loki-config
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: loki
spec:
  type: NodePort
  ports:
    - name: gossip
      port: 7946
      targetPort: 7946
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 31000
  selector:
    app: loki