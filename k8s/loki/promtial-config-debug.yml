apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-promtail-config
  namespace: loki
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: debug  # 添加调试级别

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.loki.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      # Job 1: 使用静态配置直接读取所有 pods 日志（测试用）
      - job_name: static-pods-debug
        static_configs:
          - targets: ['localhost']
            labels:
              job: static-pods-debug
              __path__: /var/log/pods/**/*.log
        pipeline_stages:
          - regex:
              expression: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/(?P<instance>\d+)\.log$'
              source: filename
          - labels:
              namespace: namespace
              pod: pod
              container: container

      # Job 2: 简化版 Kubernetes 服务发现
      - job_name: kubernetes-simple
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # 记录所有发现的 Pod（调试用）
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_container_name]
            target_label: container
          # 使用静态路径测试
          - action: replace
            target_label: __path__
            replacement: /var/log/pods/*/*/*.log  # 简化路径
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: loki-promtail
  namespace: loki
spec:
  selector:
    matchLabels:
      app: loki-promtail
  template:
    metadata:
      labels:
        app: loki-promtail
    spec:
      tolerations:
        - operator: Exists
      securityContext:
        runAsUser: 0
      containers:
        - name: promtail
          image: grafana/promtail:3.5.8
          args:
            - -config.file=/etc/promtail/promtail.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /run/promtail
            - name: varlog
              mountPath: /var/log
            - name: pods
              mountPath: /var/log/pods  # 确保挂载了这个目录
      volumes:
        - name: config
          configMap:
            name: loki-promtail-config
        - name: positions
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
        - name: pods
          hostPath:
            path: /var/log/pods  # 确保挂载了这个目录
      serviceAccountName: promtail