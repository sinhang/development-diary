apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-promtail-config
  namespace: loki
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: debug

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.loki.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      # Job 1: 收集系统日志
      - job_name: system
        static_configs:
          - targets: ['localhost']
            labels:
              job: varlogs
              __path__: /var/log/*.log

      # Job 2: 收集所有 Pod 日志（使用 /var/log/pods/ 目录）
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - docker: {}
        relabel_configs:
          # 基础标签
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          
          # 应用标签（兼容多种标签格式）
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app_kubernetes_io_name
          
          # 关键修改：使用 /var/log/pods/ 路径
          - action: replace
            replacement: /var/log/pods/$1/$2/*.log
            separator: '/'
            target_label: __path__
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_container_name

      # Job 3: fengqi-dev 命名空间
      - job_name: fengqi-dev
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - docker: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: fengqi-dev
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - replacement: dev
            target_label: environment
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_container_name]
            target_label: container
          - action: replace
            replacement: /var/log/pods/$1/$2/*.log
            separator: '/'
            target_label: __path__
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_container_name

      # Job 4: fengqi-test 命名空间
      - job_name: fengqi-test
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - docker: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: fengqi-test
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - replacement: test
            target_label: environment
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_container_name]
            target_label: container
          - action: replace
            replacement: /var/log/pods/$1/$2/*.log
            separator: '/'
            target_label: __path__
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_container_name

      # Job 5: fengqi-prod 命名空间
      - job_name: fengqi-prod
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - docker: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: fengqi-prod
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - replacement: prod
            target_label: environment
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_container_name]
            target_label: container
          - action: replace
            replacement: /var/log/pods/$1/$2/*.log
            separator: '/'
            target_label: __path__
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_container_name

      # Job 6: argocd 命名空间
      - job_name: argocd
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - docker: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: argocd
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - replacement: argocd
            target_label: environment
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_container_name]
            target_label: container
          - action: replace
            replacement: /var/log/pods/$1/$2/*.log
            separator: '/'
            target_label: __path__
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_container_name
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: loki-promtail
  namespace: loki
spec:
  selector:
    matchLabels:
      app: loki-promtail
  template:
    metadata:
      labels:
        app: loki-promtail
    spec:
      tolerations:
        - operator: Exists
      securityContext:
        runAsUser: 0
      containers:
        - name: promtail
          image: grafana/promtail:3.5.8
          args:
            - -config.file=/etc/promtail/promtail.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /run/promtail
            - name: varlog
              mountPath: /var/log
            - name: pods
              mountPath: /var/log/pods  # 确保挂载了这个目录
      volumes:
        - name: config
          configMap:
            name: loki-promtail-config
        - name: positions
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
        - name: pods
          hostPath:
            path: /var/log/pods  # 确保挂载了这个目录
      serviceAccountName: promtail