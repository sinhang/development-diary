# kubeadm 配置文件 
# 生成文件 kubeadm config print init-defaults > kubeadm-config.yaml
# 初始化 kubeadm init --config kubeadm-config.yaml --ignore-preflight-errors=Port-2379,Port-2380
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
bootstrapTokens:
- groups:
  - system:bootstrappers:kubeadm:default-node-token
  token: abcdef.0123456789abcdef
  ttl: 24h0m0s
  usages:
  - signing
  - authentication
localAPIEndpoint:
  advertiseAddress: 192.168.1.100
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///var/run/containerd/containerd.sock
  imagePullPolicy: IfNotPresent
  imagePullSerial: true
  name: node
  taints: null
timeouts:
  controlPlaneComponentHealthCheck: 4m0s
  discovery: 5m0s
  etcdAPICall: 2m0s
  kubeletHealthCheck: 4m0s
  kubernetesAPICall: 1m0s
  tlsBootstrap: 5m0s
  upgradeManifests: 5m0s
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: 1.33.7
clusterName: kubernetes
controlPlaneEndpoint: "192.168.1.100:6443"
certificatesDir: /etc/kubernetes/pki
imageRepository: registry.aliyuncs.com/google_containers
networking:
  dnsDomain: cluster.local
  serviceSubnet: 10.96.0.0/12
  podSubnet: 10.244.0.0/16
encryptionAlgorithm: RSA-2048
caCertificateValidityPeriod: 87600h0m0s
certificateValidityPeriod: 8760h0m0s

# --- 修改重点 1：API Server 参数格式 ---
apiServer:
  extraArgs:
  - name: "etcd-servers"
    value: "https://127.0.0.1:2389"

# --- 修改重点 2：Etcd 参数格式 ---
etcd:
  local:
    dataDir: /var/lib/k8s-etcd
    extraArgs:
    - name: "listen-client-urls"
      value: "https://127.0.0.1:2389,https://192.168.1.100:2389"
    - name: "advertise-client-urls"
      value: "https://192.168.1.100:2389"
    - name: "listen-peer-urls"
      value: "https://192.168.1.100:2390"
    - name: "initial-advertise-peer-urls"
      value: "https://192.168.1.100:2390"
    - name: "initial-cluster"
      value: "node=https://192.168.1.100:2390"

controllerManager: {}
scheduler: {}
dns: {}
proxy: {}